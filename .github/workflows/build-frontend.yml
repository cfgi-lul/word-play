name: Build frontend

on:
  push:
    branches: [main, master]
    paths:
      - 'wordplay/frontend/**'
      - '.github/workflows/build-frontend.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'wordplay/frontend/**'
      - '.github/workflows/build-frontend.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wordplay/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wordplay/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: word-play-frontend
          path: wordplay/frontend/dist/word-play
          if-no-files-found: error
