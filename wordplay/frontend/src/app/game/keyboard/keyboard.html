<div class="keyboard" role="group" [attr.aria-label]="'app.keyboardAria' | t: locale()">
  @for (row of rows(); track $index; let last = $last) {
    <div class="keyboard__row" [class.keyboard__row--last]="last">
      @for (key of row; track key) {
        <button
          type="button"
          class="key"
          [attr.data-key]="key"
          [class.key--correct]="statusOf(key) === 'correct'"
          [class.key--present]="statusOf(key) === 'present'"
          [class.key--absent]="statusOf(key) === 'absent'"
          [class.key--pressed]="isPressed(key)"
          [disabled]="disabled()"
          (click)="onLetterClick(key, $event)"
        >
          {{ key }}
        </button>
      }

      @if (last) {
        <button
          type="button"
          class="key key--action"
          data-key="backspace"
          [class.key--pressed]="isPressed('backspace')"
          [attr.aria-label]="'app.backspaceAria' | t: locale()"
          [disabled]="disabled()"
          (click)="onBackspaceClick($event)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M18.5 5h-8.2c-.6 0-1.2.3-1.6.7L3 12l5.7 6.3c.4.5 1 .7 1.6.7h8.2c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-2.1 10.1-1.4 1.4-2.5-2.5-2.5 2.5-1.4-1.4 2.5-2.5-2.5-2.5 1.4-1.4 2.5 2.5 2.5-2.5 1.4 1.4-2.5 2.5 2.5 2.5z"
              fill="currentColor"
            />
          </svg>
        </button>
        <button
          type="button"
          class="key key--action key--enter"
          data-key="enter"
          [class.key--pressed]="isPressed('enter')"
          [attr.aria-label]="'app.confirmAria' | t: locale()"
          [disabled]="disabled()"
          (click)="onEnterClick($event)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M9.2 16.6 4.8 12.2l1.4-1.4 3 3 8-8 1.4 1.4-9.4 9.4z"
              fill="currentColor"
            />
          </svg>
        </button>
      }
    </div>
  }
</div>
