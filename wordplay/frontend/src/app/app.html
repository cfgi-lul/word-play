<tui-root>
  <router-outlet />

  @if (helpOpen()) {
    <div class="help-backdrop" (click)="closeHelp()"></div>
    <div
      class="help-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="help-title"
      (click)="$event.stopPropagation()"
    >
      <tui-scrollbar class="help-modal__scroll">
        <div class="help-modal__content">
          <app-how-to-play
            [locale]="locale()"
            [wordLength]="wordLength()"
            [maxAttempts]="maxAttempts()"
            (closed)="closeHelp()"
          />
          <div class="dialog-actions">
            <button
              #gotIt
              tuiButton
              type="button"
              appearance="primary"
              size="m"
              (click)="closeHelp()"
            >
              {{ 'app.gotIt' | t: locale() }}
            </button>
          </div>
        </div>
      </tui-scrollbar>
    </div>
  }
</tui-root>
